name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run development regressions
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain --stacktrace

      # Headless server GameTest (Fabric) in a disposable world under build/gametest.
      # Client GameTest needs OpenGL and stays a local check (TESTING_RU.md).
      - name: Run server GameTest
        run: ./gradlew runGameTest --console=plain --stacktrace

      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: build/reports/gametest/
          if-no-files-found: warn

      - name: Check whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: smart-aul-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
